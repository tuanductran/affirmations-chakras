[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "affirmations-chakras"
version = "0.1.0"
description = "Vietnamese self-reflection tools for seven chakra themes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Tuan Duc Tran" }]
dependencies = []

[project.scripts]
score-chakras = "scripts.score_chakras:main"
generate-chakra-plan = "scripts.generate_365_day_plan:main"

[dependency-groups]
dev = [
    "markdown-it-py>=3,<4",
    "mdformat>=1,<1.1",
    "mdformat-frontmatter>=2,<3",
    "mdformat-gfm>=0.4.1,<0.5",
    "pip-audit>=2.9,<3",
    "pymarkdownlnt>=0.9,<1",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6.2,<8",
    "ruff>=0.17,<0.18",
    "ty>=0.0.1,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=scripts --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
