name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --all-groups --python ${{ matrix.python-version }}
      - run: uv run --locked --python ${{ matrix.python-version }} python -c "import sys; assert sys.version_info[:2] == tuple(map(int, '${{ matrix.python-version }}'.split('.')))"
      - run: uv run --locked --python ${{ matrix.python-version }} pytest --cov=scripts --cov-report=term-missing --cov-fail-under=85
      - run: uv run --locked --python ${{ matrix.python-version }} ruff check .
      - run: uv run --locked --python ${{ matrix.python-version }} ruff format --check .
      - run: uv run --locked --python ${{ matrix.python-version }} ty check scripts tests
      - run: uv run --locked --python ${{ matrix.python-version }} mdformat --check --number --wrap 100 README.md AGENTS.md CONTRIBUTING.md SECURITY.md SKILL.md question-banks references .agents/skills
      - run: uv run --locked --python ${{ matrix.python-version }} pymarkdown --enable-extensions front-matter -d MD013 scan -r . --respect-gitignore
      - run: uv run --locked --python ${{ matrix.python-version }} pip-audit --skip-editable
        if: matrix.python-version == '3.12'
      - run: uv build --python ${{ matrix.python-version }}
      - name: Smoke-test built wheel entry points
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"

          uv run --isolated --no-project --python 3.12 --with "$wheel" score-chakras --mau > "$RUNNER_TEMP/scores-template.json"
          uv run --isolated --python 3.12 python -c "import json,sys; data=json.load(open(sys.argv[1], encoding='utf-8')); assert len(data) == 7 and all(len(values) == 5 for values in data.values())" "$RUNNER_TEMP/scores-template.json"

          uv run --isolated --no-project --python 3.12 --with "$wheel" generate-chakra-plan --output "$RUNNER_TEMP/plan.md"
          uv run --isolated --python 3.12 python -c "import pathlib,re,sys; text=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'); assert len(re.findall(r'^## Ngày ', text, re.MULTILINE)) == 365" "$RUNNER_TEMP/plan.md"
